[package]
name = "embassy-at32"
version = "0.1.0"
edition = "2024"
description = "Embassy HAL support for Artery AT32F403A (FNIRSI FNB58 port)"
license = "MIT OR Apache-2.0"
publish = false
categories = ["embedded", "hardware-support", "no-std"]
keywords = ["arm", "cortex-m", "at32", "hal", "embassy"]

[features]
default = ["time-driver"]
time-driver = ["dep:embassy-time-driver", "dep:embassy-time-queue-utils", "embassy-time/tick-hz-1_000"]
rt = ["at32f4xx-pac/rt"]
critical-section-single-core = ["cortex-m/critical-section-single-core"]

# Host tests need a critical-section implementation; embedded builds get it
# from the board (or the critical-section-single-core feature).
[target.'cfg(not(target_os = "none"))'.dev-dependencies]
critical-section = { workspace = true, features = ["std"] }

[dependencies]
cortex-m.workspace = true
critical-section.workspace = true
embassy-futures.workspace = true
embassy-sync.workspace = true
embassy-time.workspace = true
embassy-time-driver = { workspace = true, optional = true }
embassy-time-queue-utils = { workspace = true, optional = true, features = ["generic-queue-16"] }
embedded-hal.workspace = true
embedded-hal-async.workspace = true
embedded-io.workspace = true
embedded-io-async.workspace = true
at32f4xx-pac.workspace = true
thiserror = { workspace = true, default-features = false }
